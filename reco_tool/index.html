<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOLVE-IT Extension — 콘텐츠 추천</title>
<style>
  :root{--bg:#0f1420;--card:#1a2233;--card2:#141b29;--line:#2a3550;
    --fg:#e8edf7;--mut:#8a97b3;--acc:#5b8cff;--aug:#f0a94a;--new:#4ad3a0;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{padding:22px 26px;border-bottom:1px solid var(--line);
    display:flex;flex-wrap:wrap;gap:14px;align-items:center}
  h1{font-size:19px;margin:0;font-weight:650}
  .sub{color:var(--mut);font-size:13px}
  .wrap{max-width:1080px;margin:0 auto;padding:22px 26px}
  .searchbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
  input[type=text]{flex:1;min-width:240px;background:var(--card2);
    border:1px solid var(--line);color:var(--fg);padding:11px 14px;
    border-radius:9px;font-size:15px}
  select,button{background:var(--card2);border:1px solid var(--line);
    color:var(--fg);padding:11px 14px;border-radius:9px;font-size:14px;cursor:pointer}
  button.go{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
  .hint{color:var(--mut);font-size:12.5px;margin:8px 2px 20px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  @media(max-width:820px){.cols{grid-template-columns:1fr}}
  .col h2{font-size:14px;letter-spacing:.03em;text-transform:uppercase;
    color:var(--mut);margin:0 0 12px;display:flex;align-items:center;gap:8px}
  .dot{width:9px;height:9px;border-radius:50%}
  .dot.aug{background:var(--aug)}.dot.new{background:var(--new)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:15px 16px;margin-bottom:14px}
  .rank{font-size:12px;color:var(--mut);font-weight:600}
  .cname{font-weight:600;margin:3px 0 7px;font-size:15px}
  .target{font-size:12.5px;color:var(--aug);margin-bottom:8px}
  .target.new{color:var(--new)}
  .csum{font-size:13px;color:#c3ccdf;margin-bottom:10px;max-height:78px;overflow:hidden}
  .why{background:var(--card2);border-radius:8px;padding:8px 10px;font-size:12px;
    color:var(--mut);margin-bottom:10px}
  .why b{color:var(--fg)}
  .refs{font-size:12px;margin-bottom:12px}
  .refs a{color:var(--acc);text-decoration:none}
  .refs .cite{color:var(--new);font-weight:600}
  .mkbtn{background:var(--acc);border:none;color:#fff;padding:9px 13px;
    border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;width:100%}
  .empty{color:var(--mut);font-size:13px;padding:14px;border:1px dashed var(--line);
    border-radius:10px;text-align:center}
  .flags{font-size:12px;color:var(--mut);margin-top:6px}
  .badge{display:inline-block;background:var(--card2);border:1px solid var(--line);
    border-radius:20px;padding:2px 9px;font-size:11px;color:var(--mut);margin-left:6px}
</style>
</head>
<body>
<header>
  <div>
    <h1>SOLVE-IT Extension <span class="badge" id="cite-badge">인용 캐시 확인 중</span></h1>
    <div class="sub">관심 키워드로 LLM-Wiki를 검색해, SOLVE-IT에 추가할 후보를 보강·신규로 나눠 추천합니다.</div>
  </div>
</header>
<div class="wrap">
  <div class="searchbar">
    <input id="q" type="text" placeholder="관심 키워드 (예: timestamp, memory acquisition, SQLite, deepfake)">
    <select id="type">
      <option value="all">전체 유형</option>
      <option value="techniques">technique</option>
      <option value="weaknesses">weakness</option>
      <option value="mitigations">mitigation</option>
    </select>
    <button class="go" onclick="run()">추천</button>
  </div>
  <div class="hint" id="hint"></div>
  <div class="searchbar" style="margin-bottom:18px">
    <input id="repo" type="text" value="SOLVE-IT-DF/solve-it"
      placeholder="이슈를 등록할 GitHub 저장소 (owner/repo)"
      style="min-width:auto;flex:0 1 320px;font-size:13px">
    <span class="sub" style="align-self:center">← 이슈 프리필 대상 저장소</span>
  </div>
  <div class="cols">
    <div class="col">
      <h2><span class="dot aug"></span>기존 항목 보강 (augment)</h2>
      <div id="aug"></div>
    </div>
    <div class="col">
      <h2><span class="dot new"></span>신규 지식 (new)</h2>
      <div id="new"></div>
    </div>
  </div>
</div>

<script src="reco_data.js"></script>
<script>
const D = window.RECO_DATA;
const TPL = {  // 유형 → {new: propose폼, upd: update폼}
  techniques:{new:"1a_propose-new-technique-form.yml",upd:"2a_update-technique-form.yml",
    nameF:"technique-name",descF:"description",detF:"details",refF:"references",
    idF:"technique-id",updNameF:"new-technique-name",updDescF:"new-details"},
  weaknesses:{new:"1b_propose-new-weakness-form.yml",upd:"2b_update-weakness-form.yml",
    nameF:"weakness-name",descF:"description",detF:null,refF:"references",
    idF:"weakness-id",updNameF:"new-weakness-name",updDescF:"new-description"},
  mitigations:{new:"1c_propose-new-mitigation-form.yml",upd:"2c_update-mitigation-form.yml",
    nameF:"mitigation-name",descF:"description",detF:null,refF:"references",
    idF:"mitigation-id",updNameF:"new-mitigation-name",updDescF:"new-description"},
};

document.getElementById("cite-badge").textContent =
  D.has_citations ? "피인용수 반영됨" : "피인용수 미반영 (fetch_citations.py 실행 시 반영)";
document.getElementById("q").addEventListener("keydown",e=>{if(e.key==="Enter")run()});

function relevance(item, terms){
  const name=item.name.toLowerCase(), sum=(item.summary||"").toLowerCase(),
        desc=(item.description||"").toLowerCase();
  let s=0;
  for(const t of terms){
    if(!t) continue;
    if(name.includes(t)) s+=3;
    if(desc.includes(t)) s+=1.5;
    if(sum.includes(t)) s+=1;
  }
  return s;
}

function run(){
  const q=document.getElementById("q").value.trim().toLowerCase();
  const typ=document.getElementById("type").value;
  const terms=q.split(/[\s,]+/).filter(Boolean);
  const hint=document.getElementById("hint");
  if(!terms.length){hint.textContent="키워드를 입력하세요.";return;}

  let pool=D.items.filter(i=>typ==="all"||i.type===typ);
  pool=pool.map(i=>({...i,rel:relevance(i,terms)})).filter(i=>i.rel>0);

  // 피인용 최대값(정규화용)
  const maxCite=Math.max(1,...pool.map(i=>i.max_cited_by||0));
  const maxRel=Math.max(1,...pool.map(i=>i.rel));
  for(const i of pool){
    const relN=i.rel/maxRel;                         // 0..1 주 신호
    const citeN=D.has_citations?(i.max_cited_by||0)/maxCite:0; // 0..1 보조
    i.score=relN*0.7 + citeN*0.3;
  }
  const aug=pool.filter(i=>i.class==="augment").sort((a,b)=>b.score-a.score).slice(0,3);
  const nw =pool.filter(i=>i.class==="new").sort((a,b)=>b.score-a.score).slice(0,3);
  hint.innerHTML=`"<b>${q}</b>" 검색: 매칭 ${pool.length}건 중 보강 ${aug.length}·신규 ${nw.length} 상위 표시`;
  render("aug",aug,terms); render("new",nw,terms);
}

function refsHtml(item){
  if(!item.refs||!item.refs.length) return '<div class="refs" style="color:var(--mut)">참고문헌 정보 없음</div>';
  return '<div class="refs">'+item.refs.map(r=>{
    const doi=(r.doi||"").replace(/^https?:\/\/(dx\.)?doi\.org\//,"");
    const link=doi?`https://doi.org/${doi}`:(r.doi||"#");
    const cite=(r.cited_by!=null)?` <span class="cite">인용 ${r.cited_by}</span>`:"";
    const who=[r.authors,r.year].filter(Boolean).join(", ");
    return `📄 <a href="${link}" target="_blank">${r.title||r.id}</a>`+
           (who?` <span style="color:var(--mut)">(${who})</span>`:"")+cite;
  }).join("<br>")+'</div>';
}

function render(el,list,terms){
  const box=document.getElementById(el);
  if(!list.length){box.innerHTML='<div class="empty">해당 유형의 후보가 없습니다.</div>';return;}
  box.innerHTML=list.map((i,idx)=>{
    const isAug=i.class==="augment";
    const tgt=isAug&&i.matches[0]
      ? `<div class="target">→ SOLVE-IT [${i.matches[0].id}] ${i.matches[0].name} 에 추가 (유사도 ${i.matches[0].sim})</div>`
      : `<div class="target new">→ SOLVE-IT에 대응 항목 없음 (신규 제안)</div>`;
    const cite=i.max_cited_by?`최다 피인용 <b>${i.max_cited_by}</b>회`:(D.has_citations?"피인용 0":"피인용 미조회");
    const why=`<div class="why">근거: 키워드 적합도 <b>${i.rel.toFixed(1)}</b> · ${cite} · 근거논문 <b>${i.refs.length}</b>편 · 종합점수 <b>${i.score.toFixed(2)}</b></div>`;
    return `<div class="card">
      <div class="rank">#${idx+1} · ${i.id} · ${i.type.slice(0,-1)}</div>
      <div class="cname">${i.name}</div>
      ${tgt}
      <div class="csum">${i.summary||i.description||""}</div>
      ${why}
      ${refsHtml(i)}
      <button class="mkbtn" onclick='mkIssue(${JSON.stringify(i.id)})'>이 항목으로 GitHub 이슈 작성 →</button>
    </div>`;
  }).join("");
}

function mkIssue(id){
  const i=D.items.find(x=>x.id===id);
  const repo=document.getElementById("repo").value.trim()||"SOLVE-IT-DF/solve-it";
  const t=TPL[i.type];
  const refLines=(i.refs||[]).map(r=>{
    const doi=(r.doi||"").replace(/^https?:\/\/(dx\.)?doi\.org\//,"");
    return `- ${r.title||r.id}${doi?` (https://doi.org/${doi})`:""}`;
  }).join("\n");
  const p=new URLSearchParams();
  let template, body;
  if(i.class==="augment" && i.matches[0]){
    template=t.upd;
    p.set(t.idF, i.matches[0].id);
    p.set(t.updNameF, i.name);
    p.set(t.updDescF, i.description||i.summary||"");
  }else{
    template=t.new;
    p.set(t.nameF, i.name);
    p.set(t.descF, i.description||i.summary||"");
    if(t.detF) p.set(t.detF, i.summary||"");
  }
  p.set(t.refF, refLines || "(LLM-Wiki 추출 근거 참조)");
  p.set("other-notes",
    `[SOLVE-IT Extension 자동 추천] LLM-Wiki 항목 ${i.id} 기반. `+
    `분류: ${i.class}. SOLVE-IT 최근접: ${i.matches[0]?i.matches[0].id+" (sim "+i.matches[0].sim+")":"없음"}.`);
  p.set("template", template);
  const url=`https://github.com/${repo}/issues/new?${p.toString()}`;
  window.open(url,"_blank");
}
</script>
</body>
</html>
